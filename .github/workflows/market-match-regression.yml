name: Market Match Regression Checks

on:
  pull_request:
    paths:
      - "client/src/pages/PublicMarketMatchQuizPage.tsx"
      - "client/src/pages/MarketMatchQuizAdminPage.tsx"
      - "server/marketMatchQuiz.ts"
      - "server/routers/marketMatchQuiz.ts"
      - "server/marketMatchQuiz.test.ts"
      - ".github/workflows/market-match-regression.yml"
  push:
    branches:
      - main
    paths:
      - "client/src/pages/PublicMarketMatchQuizPage.tsx"
      - "client/src/pages/MarketMatchQuizAdminPage.tsx"
      - "server/marketMatchQuiz.ts"
      - "server/routers/marketMatchQuiz.ts"
      - "server/marketMatchQuiz.test.ts"
      - ".github/workflows/market-match-regression.yml"

permissions:
  contents: read

jobs:
  regression:
    name: Type safety and Market Match regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm exec tsc --noEmit
      - name: Run Market Match regression suite
        run: pnpm exec vitest run server/marketMatchQuiz.test.ts server/marketMatch.test.ts server/marketMatchSettings.test.ts
